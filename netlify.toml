[build]
  command = "npm run build"
  publish = "dist"

# This is a Vite SPA, not Next.js: disable the Next.js runtime installed via the UI
[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Serve index.html for client-side routes handled by React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
