[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # This is a Vite app; skip the Next.js plugin installed from the Netlify UI
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Serve index.html for client-side (React Router) routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
